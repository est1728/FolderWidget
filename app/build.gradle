plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.est.folderwidget'
    compileSdk 34

    // CI (GitHub Actions) ส่ง -PappVersionCode=<เลขวิ่งขึ้นเรื่อยๆ> -PappVersionName=<เช่น 1.2> เข้ามา
    // ถ้า build เองในเครื่อง (ไม่ผ่าน CI) จะ fallback เป็นค่า default ด้านล่าง
    def verCode = project.hasProperty('appVersionCode') ? (project.appVersionCode as Integer) : 1
    def verName = project.hasProperty('appVersionName') ? project.appVersionName : "1.0"

    defaultConfig {
        applicationId "com.est.folderwidget"
        minSdk 26
        targetSdk 34
        versionCode verCode
        versionName verName
    }

    // เซ็นแอพด้วยคีย์เดียวกันทุกครั้งที่ build (จำเป็นมากสำหรับฟีเจอร์ "อัปเดตในแอพ" —
    // ถ้าเซ็นด้วยคีย์คนละอันทุกครั้ง Android จะปฏิเสธการติดตั้งทับของเก่า)
    // อ่านค่าจาก environment variable ที่ตั้งใน GitHub Actions secrets เท่านั้น ไม่ hardcode รหัสในนี้
    signingConfigs {
        release {
            def ksPath = System.getenv("SIGNING_KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("SIGNING_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // ใช้ signingConfig เฉพาะตอนที่มี env vars ครบ (เช่นตอนรันบน CI) กัน error ตอน build ในเครื่อง
            if (System.getenv("SIGNING_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
}
